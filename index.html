function setStatus(uid,status){
 let now=new Date(); let tStr=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 let item=window.STATE.find(s=>s.uid===uid); if(!item) return;
 if(status!=='todo') TIMES[uid]=tStr; else delete TIMES[uid];
 PICKS[uid]=status;
 localStorage.setItem('pali_picks', JSON.stringify(PICKS));
 localStorage.setItem('pali_times', JSON.stringify(TIMES));
 render();
}
function pickNext(currentUid){
 let state=window.STATE||[]; let idx=state.findIndex(s=>s.uid===currentUid);
 let next=null;
 for(let i=idx+1;i<state.length;i++){ if(getStatus(state[i].uid)==='todo'){ next=state[i]; break; } }
 if(!next){ for(let i=0;i<state.length;i++){ if(getStatus(state[i].uid)==='todo' && state[i].uid!==currentUid){ next=state[i]; break; } } }
 if(next){ let el=document.getElementById('card_'+next.uid); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('nextHighlight'); setTimeout(()=>el.classList.remove('nextHighlight'),2000); } }
}
function render(){
 let state=window.STATE||[]; let cardsDiv=document.getElementById('cards'); cardsDiv.innerHTML='';
 let picked=0, parked=0, ware=0, todo=0;
 let firstTodoUid=null; for(let o of state){ if(getStatus(o.uid)==='todo'){ firstTodoUid=o.uid; break; } }
 state.forEach((o,i)=>{
  let st=getStatus(o.uid); if(st==='picked') picked++; else if(st==='parked') parked++; else if(st==='warehouse') ware++; else todo++;
  let isCurrent=(o.uid===firstTodoUid);
  let cls='card '+(st==='todo' ? (isCurrent?'current':'unpicked') : st);
  let code=o.code||o.f.c||''; let qty=o.qty||1; let aisle=o.f.a||'?'; let unit=o.f.l||'??'; let prod=o.name||o.f.n;
  let html='<div id="card_'+o.uid+'" class="'+cls+'"><div class="left"><div class="lbl">AISLE</div><div class="big">'+aisle+'</div><div class="lbl">UNIT</div><div class="unitBig">'+unit+'</div></div><div class="right"><div class="prod">'+prod+' #'+(o.origIdx+1)+'</div><div class="meta"><span class="tag">CODE '+ (code||'NEW') +'</span><span class="tag qty">QTY '+qty+'</span></div>'+ (st==='todo' ? '<button class="nextBtn" onclick="pickNext(\''+o.uid+'\')">👉 PICK NEXT - '+aisle+' '+unit+'</button>' : '') +'<div class="actionRow"><button class="sBtn pick" onclick="setStatus(\''+o.uid+'\',\'picked\')">✓ PICKED</button><button class="sBtn park" onclick="setStatus(\''+o.uid+'\',\'parked\')">🅿️ PARKED</button></div><div class="actionRow"><button class="sBtn ware" onclick="setStatus(\''+o.uid+'\',\'warehouse\')">🏭 WAREHOUSE</button><button class="sBtn edit" onclick="editLoc(\''+o.uid+'\')">EDIT ALL</button></div></div></div>';
  cardsDiv.innerHTML+=html;
 });
 document.getElementById('stats').innerHTML='Picks: <span style="color:#1b5e20">'+picked+' PICKED</span> / <span style="color:#c62828">'+parked+' PARKED</span> / <span style="color:#6a1b9a">'+ware+' WAREHOUSE</span> / <span style="color:#666">'+todo+' UNPICKED</span> | Total: '+state.length+' | Mode: '+MODE;
 if(state.length>0){
  document.getElementById('reportBox').style.display='block';
  let txt='Handset lines: '+state.length+'\n--------------------------------------------\n';
  txt+='PICKED ('+picked+'):\n'; state.filter(s=>getStatus(s.uid)==='picked').forEach((s,i)=>{ txt+=(i+1)+'. '+s.name+' | Aisle '+s.f.a+' Unit '+s.f.l+' | CODE '+(s.code||s.f.c)+' | QTY '+s.qty+' | PICKED @ '+(TIMES[s.uid]||'')+'\n'; });
  txt+='\nPARKED ('+parked+'):\n'; state.filter(s=>getStatus(s.uid)==='parked').forEach((s,i)=>{ txt+=(i+1)+'. '+s.name+' | Aisle '+s.f.a+' Unit '+s.f.l+' | CODE '+(s.code||s.f.c)+' | QTY '+s.qty+' | PARKED @ '+(TIMES[s.uid]||'')+'\n'; });
  txt+='\nWAREHOUSE CHECK ('+ware+'):\n'; state.filter(s=>getStatus(s.uid)==='warehouse').forEach((s,i)=>{ txt+=(i+1)+'. '+s.name+' | Aisle '+s.f.a+' Unit '+s.f.l+' | CODE '+(s.code||s.f.c)+' | QTY '+s.qty+' | WAREHOUSE @ '+(TIMES[s.uid]||'')+'\n'; });
  txt+='\nUNPICKED ('+todo+'):\n'; state.filter(s=>getStatus(s.uid)==='todo').forEach((s,i)=>{ txt+=(i+1)+'. '+s.name+' | '+s.f.a+' '+s.f.l+'\n'; });
  txt+='\nNotes: Handset is master - this is assist record only\nGenerated offline by PALiPiCKER KEEP ON PICKIN 240926\n';
  document.getElementById('report').textContent=txt;
 }
 renderLocal();
}
function clearAll(){ if(!confirm('Clear all?')) return; document.getElementById('list').value=''; window.STATE=[]; PICKS={}; TIMES={}; localStorage.removeItem('pali_picks'); localStorage.removeItem('pali_times'); document.getElementById('cards').innerHTML=''; document.getElementById('info').style.display='none'; document.getElementById('stats').innerHTML=''; document.getElementById('reportBox').style.display='none'; }
function downloadTxt(){ let txt=document.getElementById('report').textContent; let blob=new Blob([txt],{type:'text/plain'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='PALiPiCKER_REPORT_'+new Date().toISOString().slice(0,10)+'.txt'; a.click(); }
function copyTxt(){ navigator.clipboard.writeText(document.getElementById('report').textContent).then(()=>alert('Copied')); }
function shareTxt(){ if(navigator.share){ navigator.share({title:'PALiPiCKER Report', text:document.getElementById('report').textContent}); } else copyTxt(); }
function toggleUnpicked(){ SHOW_UNPICKED=!SHOW_UNPICKED; render(); }
function editLoc(uid){ let item=window.STATE.find(s=>s.uid===uid); if(!item) return; let newA=prompt('New Aisle (e.g. A1):', item.f.a); if(newA===null) return; let newL=prompt('New Unit (e.g. F1S2):', item.f.l); if(newL===null) return; let overrides=getOverrides(); overrides=overrides.filter(o=>o.n.toLowerCase()!==item.f.n.toLowerCase()||o.a!==item.f.a||o.l!==item.f.l); overrides.push({n:item.f.n,a:newA.trim().toUpperCase(),l:newL.trim().toUpperCase(),c:item.f.c}); saveOverrides(overrides); resetMap(); run(); }
function renderLocal(){ let ov=getOverrides(); let div=document.getElementById('localList'); if(ov.length===0){ div.innerHTML='<div style="color:#888">No local edits yet</div>'; return; } let h='<div style="font-weight:800;margin-bottom:6px">My Local ('+ov.length+')</div>'; ov.forEach((o,i)=>{ h+='<div style="padding:8px 0;border-bottom:1px solid #eee;font-size:14px">'+o.n+' → '+o.a+' '+o.l+' '+o.c+' <button onclick="delLocal('+i+')" style="background:#c62828;color:#fff;border:none;border-radius:999px;padding:4px 10px;font-weight:800;margin-left:8px">X</button> <button onclick="editLocal('+i+')" style="background:#111;color:#fff;border:none;border-radius:999px;padding:4px 10px;font-weight:800">EDIT</button></div>'; }); div.innerHTML=h; }
function delLocal(i){ let ov=getOverrides(); ov.splice(i,1); saveOverrides(ov); resetMap(); renderLocal(); if(window.STATE) run(); }
function editLocal(i){ let ov=getOverrides(); let o=ov[i]; let a=prompt('Aisle',o.a); if(a===null) return; let l=prompt('Unit',o.l); if(l===null) return; o.a=a.toUpperCase(); o.l=l.toUpperCase(); saveOverrides(ov); resetMap(); renderLocal(); if(window.STATE) run(); }
try{ PICKS=JSON.parse(localStorage.getItem('pali_picks')||'{}'); TIMES=JSON.parse(localStorage.getItem('pali_times')||'{}'); }catch(e){}
resetMap();
</script>
</body></html>
