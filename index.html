<div id="paliLoginGate">
  <div id="paliLoginBox">
    <h1>PALiPiCKER</h1>
    <p>KEEP ON PICKIN'</p>
    <input id="paliPin" type="password" inputmode="numeric" autocomplete="off"
           maxlength="8" placeholder="PIN" aria-label="PIN">
    <button id="paliLoginButton" type="button">ENTER PICKER</button>
    <div id="paliLoginError"></div>
  </div>
</div>
<script>
(function(){
  const expected = "12061937";
  const gate = document.getElementById("paliLoginGate");
  const pin = document.getElementById("paliPin");
  const button = document.getElementById("paliLoginButton");
  const error = document.getElementById("paliLoginError");

  function enterPicker(){
    if(pin.value === expected){
      sessionStorage.setItem("pali_login_ok","1");
      gate.style.display = "none";
      pin.value = "";
      error.textContent = "";
    } else {
      error.textContent = "Incorrect PIN";
      pin.value = "";
      pin.focus();
    }
  }

  if(sessionStorage.getItem("pali_login_ok") === "1"){
    gate.style.display = "none";
  } else {
    setTimeout(function(){ pin.focus(); }, 50);
  }

  button.addEventListener("click", enterPicker);
  pin.addEventListener("keydown", function(e){
    if(e.key === "Enter") enterPicker();
  });
})();
</script>

function normalize(s){
  return s.toLowerCase()
    .replace(/&/g,' and ')
    .replace(/[^a-z0-9]+/g,' ')
    .replace(/\bpk\b/g,'pack')
    .replace(/\b6pk\b/g,'6 pack')
    .replace(/\b4pk\b/g,'4 pack')
    .replace(/\b12pk\b/g,'12 pack')
    .trim();
}
function tokenize(s){
  return normalize(s).split(/\s+/).filter(Boolean);
}
function scoreMatch(key, k){
  let keyTokens=tokenize(key);
  let kTokens=tokenize(k);
  let keySet=new Set(keyTokens);
  let kSet=new Set(kTokens);
  let common=0;
  for(let t of keySet){
    if(t.length<2) continue;
    if(kSet.has(t)) common+=1;
    else {
      for(let kt of kSet){
        if(kt.length<2) continue;
        if(kt.includes(t) || t.includes(kt)){
          if(t.length>=3 || kt.length>=3){ common+=0.8; break; }
        }
      }
    }
  }
  let score=common/Math.max(keyTokens.length,1);
  if(k.includes(key) || key.includes(k)) score+=0.5;
  return {common, score};
}
function findAll(name,code){

 if(DATA_MAP[key])return DATA_MAP[key];let normKey=normalize(key);for(let k in DATA_MAP){if(normalize(k)===normKey)return DATA_MAP[k];}
 let keyTokens=tokenize(name);if(!keyTokens.length)return [{n:name,a:'?',l:'??',c:cleanCode||'NEW'}];let scored=[];
 for(let k in DATA_MAP){let best=scoreMatch(name,k),entries=DATA_MAP[k];for(let e of entries){for(let al of (ALIASES_BY_CODE[e.c]||[])){let s=scoreMatch(name,al);if(s.score>best.score)best=s;}}if((best.common>=2||(keyTokens.length<=2&&best.common>=1))&&best.score>=0.5)scored.push({k,score:best.score,common:best.common,entries});}
 if(!scored.length){let fallback=[];for(let k in DATA_MAP){if(k.includes(key)||key.includes(k)){fallback=fallback.concat(DATA_MAP[k]);if(fallback.length>=6)break;}}return fallback.length?fallback.slice(0,6):[{n:name,a:'?',l:'??',c:cleanCode||'NEW'}];}
 scored.sort((a,b)=>b.score-a.score||b.common-a.common);let top=scored[0].score,best=[];for(let s of scored){if(s.score>=top-.15)best=best.concat(s.entries);if(best.length>=6)break;}let seen={},uniq=[];for(let e of best){let id=e.a+'|'+e.l+'|'+e.n+'|'+e.c;if(!seen[id]){seen[id]=1;uniq.push(e);}}return uniq;
}

function getStatus(uid){return PICKS[uid]||'todo';}
function setNext(uid){let item=window.STATE&&window.STATE.find(s=>s.uid===uid);if(!item) return;let st=getStatus(uid);if(st==='picked'||st==='parked'||st==='warehouse') return;NEXT_UID=uid;render();}
function setStatus(uid,status){let now=new Date();let tStr=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});let item=window.STATE.find(s=>s.uid===uid);if(!item) return;if(status!=='todo') TIMES[uid]=tStr;else delete TIMES[uid];if(status==='picked'){PICKS[uid]=status;window.STATE.filter(s=>s.groupId===item.groupId).forEach(s=>{PICKS[s.uid]=status;TIMES[s.uid]=tStr;});}else if(status.startsWith('at_')){PICKS[uid]=status;}else if(status==='todo'){window.STATE.filter(s=>s.groupId===item.groupId).forEach(s=>{PICKS[s.uid]='todo';delete TIMES[s.uid];});}else{PICKS[uid]=status;}render();}
function buildCard(o,st,isNext,nextPick){
  let others=[];
  if(o.hasAlso&&o.alsoList&&o.alsoList.length>1){
    others=o.alsoList.filter(x=>x.l!==o.f.l||x.a!==o.f.a);
  }
  let altText=others.map(x=>x.a+' '+x.l).join(', ');
  let locs=[o.f.a+' '+o.f.l];
  others.forEach(x=>{let z=x.a+' '+x.l;if(!locs.includes(z)) locs.push(z);});
  let alsoBadge=altText?'<span class="alsoBadge">ALSO '+altText+'</span>':'';
  let isSelectable=(st==='todo'||st.startsWith('at_'));
  let shownLoc=(st.startsWith('at_')?st.replace('at_','').replace('_',' '):(o.f.a+' '+o.f.l));
  let nextLoc=nextPick?(nextPick.f.a+' '+nextPick.f.l):'';let pickBand=(isSelectable&&nextPick)?'<button type="button" class="pickBand '+(isNext?'current':'')+'" onclick="setNext(\''+nextPick.uid+'\')">👉 PICK AT '+nextLoc+'</button>':'';
  let pickAtBtn='';
  if(others.length){
    pickAtBtn='<button class="sBtn at" onclick="setStatus(\''+o.uid+'\',\'at_'+others[0].a+'_'+others[0].l+'\')">PICK AT '+others[0].a+' '+others[0].l+'</button>';
  }
  let cls='i '+st+(isNext?' next':'');
  let html='<div class="'+cls+'">';
  html+='<div class="a"><small>AISLE</small><b>'+o.f.a+'</b><small>UNIT</small><b>'+o.f.l+'</b></div>';
  html+='<div class="item-main"><div class="prodName">'+o.f.n+' <small style="color:#888">#'+(o.origIdx+1)+'</small></div>';
  html+='<div class="metaRow"><span class="codePill">CODE '+(o.f.c||'NEW')+'</span><span class="qtyPill">QTY '+o.qty+'</span>'+alsoBadge+'</div>';
  html+=pickBand+'<div class="actions">';
  if(st==='todo'){
    html+='<button class="sBtn pick" onclick="setStatus(\''+o.uid+'\',\'picked\')">✓ PICKED</button>'+pickAtBtn+
          '<button class="sBtn park" onclick="setStatus(\''+o.uid+'\',\'parked\')">🅿️ PARKED</button>'+
          '<button class="sBtn wh" onclick="setStatus(\''+o.uid+'\',\'warehouse\')">🏭 WAREHOUSE</button>';
  }else if(st==='parked'){
    html+='<button class="sBtn pick" onclick="setStatus(\''+o.uid+'\',\'picked\')">✓ NOW PICKED</button>'+
          '<button class="sBtn wh" onclick="setStatus(\''+o.uid+'\',\'warehouse\')">🏭 WAREHOUSE</button>'+
          '<button class="sBtn" style="background:#eee" onclick="setStatus(\''+o.uid+'\',\'todo\')">↩️ NO PICK / UNDO</button>';
  }else if(st==='warehouse'){
    html+='<button class="sBtn pick" onclick="setStatus(\''+o.uid+'\',\'picked\')">✓ NOW PICKED</button>'+
          '<button class="sBtn park" onclick="setStatus(\''+o.uid+'\',\'parked\')">🅿️ PARKED</button>'+
          '<button class="sBtn" style="background:#eee" onclick="setStatus(\''+o.uid+'\',\'todo\')">↩️ NO PICK / UNDO</button>';
  }else if(st.startsWith('at_')){
    let loc=st.replace('at_','').replace('_',' ');
    html+='<span style="font-size:11px;font-weight:800;color:#1976d2;align-self:center">→ WILL PICK AT '+loc+'</span>'+
          '<button class="sBtn pick" onclick="setStatus(\''+o.uid+'\',\'picked\')">✓ PICKED AT '+loc+'</button>'+
          '<button class="sBtn" style="background:#eee" onclick="setStatus(\''+o.uid+'\',\'todo\')">↩️ NO PICK / UNDO PICK AT</button>';
  }else{
    html+='<button class="sBtn" style="background:#eee" onclick="setStatus(\''+o.uid+'\',\'todo\')">↩️ NO PICK / UNDO PICKED</button>';
  }
  html+='<button class="sBtn editBtn" onclick="editPick(\''+o.uid+'\')">EDIT ALL</button>';
  html+='</div></div></div>';
  return html;
}
function render(){
 let out=document.getElementById('out');
 let parkedList=document.getElementById('parkedList');
 let warehouseList=document.getElementById('warehouseList');
 let unpickedList=document.getElementById('unpickedList');
 let nextBar=document.getElementById('nextBar');
 let outHtml='',parkedHtml='',whHtml='',unpickedHtml='';
 let picked=0,parked=0,wh=0,todo=0;
 window.STATE.forEach(o=>{let st=getStatus(o.uid);if(st==='picked') picked++;else if(st==='parked') parked++;else if(st==='warehouse') wh++;else todo++;});
 let manualNextOk=NEXT_UID&&window.STATE.some(o=>o.uid===NEXT_UID&&(getStatus(o.uid)==='todo'||getStatus(o.uid).startsWith('at_')));
 if(!manualNextOk) NEXT_UID=null;
 let nextShown=false;
 window.STATE.forEach(o=>{
   let st=getStatus(o.uid);
   let isParked=st==='parked';
   let isWh=st==='warehouse';
   let isTodo=st==='todo'||st.startsWith('at_');
   let isNext=isTodo&&(NEXT_UID?o.uid===NEXT_UID:!nextShown);
   if(isNext) nextShown=true;
   let idx=window.STATE.indexOf(o),nextPick=null;for(let j=idx+1;j<window.STATE.length;j++){let ns=getStatus(window.STATE[j].uid);if(ns==='todo'||ns.startsWith('at_')){nextPick=window.STATE[j];break;}}let card=buildCard(o,st,isNext,nextPick);
   if(isParked) parkedHtml+=card;
   else if(isWh) whHtml+=card;
   else {
     outHtml+=card;
     if(isTodo) unpickedHtml+=card;
   }
 });
 out.innerHTML=outHtml;
 parkedList.innerHTML=parkedHtml;
 warehouseList.innerHTML=whHtml;
 unpickedList.innerHTML=unpickedHtml;
 document.getElementById('summary').innerHTML='Picks: <span style="color:#2e7d32">'+picked+' PICKED</span> / <span style="color:#c00">'+parked+' PARKED</span> / <span style="color:#6a1b9a">'+wh+' WAREHOUSE</span> / <span style="color:#555">'+todo+' UNPICKED</span> | Total: '+window.STATE.length+' | Mode: '+MODE;
 document.getElementById('parkedTray').style.display=parked>0?'block':'none';
 document.getElementById('warehouseTray').style.display=wh>0?'block':'none';
 document.getElementById('unpickedTray').style.display=todo>0?'block':'none';
 // The agreed layout keeps PICK NEXT inside the first product card rather than a separate top bar.
 nextBar.style.display='none';
 let totalRows=window.STATE.length;
 if(totalRows>0){document.getElementById('reportArea').style.display='block';buildReport();}
 else{document.getElementById('reportArea').style.display='none';}
}
function buildReport(){
 let now=new Date();let dateStr=now.toLocaleDateString('en-GB')+' '+now.toLocaleTimeString('en-GB');let startStr=START_TIME?START_TIME.toLocaleTimeString('en-GB'):dateStr;
 let pickedItems=[],parkedItems=[],whItems=[],todoItems=[];
 window.STATE.forEach(o=>{let st=getStatus(o.uid);let tm=TIMES[o.uid]||'';let line=(o.origIdx+1)+'. '+o.f.n+' | Aisle '+o.f.a+' Unit '+o.f.l+' | CODE '+ (o.f.c||'NEW') +' | QTY '+o.qty+' | '+st.toUpperCase()+(tm?' @ '+tm:'');if(st==='picked') pickedItems.push(line);else if(st==='parked') parkedItems.push(line);else if(st==='warehouse') whItems.push(line);else todoItems.push(line);});
 let txt='';txt+="PALiPiCKER PICK REPORT - KEEP ON PICKIN' - 260926\n";txt+='Date: '+dateStr+'\n';txt+='Start: '+startStr+'\n';txt+='Mode: '+MODE+'\n';txt+='Handset lines: '+window.STATE.length+'\n';txt+='----------------------------------------\n';txt+='PICKED ('+pickedItems.length+'):\n';pickedItems.forEach(l=>{txt+=l+'\n';});txt+='\nPARKED ('+parkedItems.length+'):\n';parkedItems.forEach(l=>{txt+=l+'\n';});txt+='\nWAREHOUSE CHECK ('+whItems.length+'):\n';whItems.forEach(l=>{txt+=l+'\n';});if(todoItems.length){txt+='\nUNPICKED - TODO ('+todoItems.length+'):\n';todoItems.forEach(l=>{txt+=l+'\n';});}txt+='\n----------------------------------------\n';txt+='Notes: Handset is master - this is assist record only\n';txt+="Generated offline by PALiPiCKER KEEP ON PICKIN' 260926\n";document.getElementById('reportTxt').value=txt;
}
function saveReport(){
 buildReport();let txt=document.getElementById('reportTxt').value;let now=new Date();let fname='PALiPiCKER_KEEP_ON_PICKIN_300926_'+now.getFullYear()+(now.getMonth()+1).toString().padStart(2,'0')+now.getDate().toString().padStart(2,'0')+'_'+now.getHours().toString().padStart(2,'0')+now.getMinutes().toString().padStart(2,'0')+'.txt';let blob=new Blob([txt],{type:'text/plain'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=fname;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function copyReport(){buildReport();let ta=document.getElementById('reportTxt');ta.select();document.execCommand('copy');alert('Report copied');}
function shareReport(){buildReport();let txt=document.getElementById('reportTxt').value;if(navigator.share){navigator.share({title:"KOPiCKER KEEP ON PICKIN' Report",text:txt}).catch(()=>{});}else{copyReport();}}
function toggleUnpicked(){let el=document.getElementById('unpickedTray');el.style.display=el.style.display==='none'?'block':'none';}
function showUnpicked(){toggleUnpicked();}
resetMap();
</script></body></html>
